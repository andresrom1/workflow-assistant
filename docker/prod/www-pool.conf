; Pool de php-fpm para el despliegue de producción.
;
; Sobrescribe el pool [www] que trae la imagen php:8.4-fpm-alpine, cuyo default es
; `pm = dynamic` con `pm.start_servers = 2`: dos hijos vivos permanentemente aunque nadie
; entre al panel, y hasta cinco bajo carga.
;
; Este proyecto es un bot de WhatsApp: el tráfico HTTP es el webhook de Meta (rápido y
; esporádico) más un panel de admin que usa una sola persona. `ondemand` encaja con eso —
; los hijos nacen cuando entra un request y se mueren a los 30s de ocio, así que la RAM
; en reposo tiende a cero en vez de quedar reservada.
;
; El techo son 6 hijos: suficiente para el webhook de Meta con el panel abierto en paralelo,
; y acotado para que un pico no compita por memoria con los queue workers.

[www]
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s

; Recicla el hijo cada 500 requests. Acota cualquier fuga de memoria del proceso sin
; costar prácticamente nada: con `ondemand` los hijos ya son efímeros.
pm.max_requests = 500
