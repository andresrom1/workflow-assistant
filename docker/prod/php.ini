[PHP]
; Límites de subida para manuales de aseguradoras (PDFs > 20MB).
; La imagen prod (Dockerfile) copia este archivo; sin él, PHP usa el default (~2M)
; y la ingesta de documentos de coberturas falla. Ver CLAUDE.md (RAG / despliegue).
post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 512M
variables_order = EGPCS

[opcache]
; La imagen php:8.4-fpm-alpine trae OPcache compilado pero APAGADO. Sin esto, cada request
; web recompila todo Laravel desde cero — es el mayor desperdicio de CPU del despliegue, y
; es lo que permite sostener la app con menos vCPU.
opcache.enable = 1

; También en CLI, pero SOLO sirve junto con `file_cache` — y sin él es contraproducente.
;
; La memoria compartida de OPcache en CLI es POR PROCESO: nace y muere con cada `php artisan`,
; asi que `enable_cli` por si solo hace que cada invocacion pague compilar Y guardar en una SHM
; que despues tira. Medido dentro de esta imagen (Alpine, con config:cache aplicado, arranque de
; `artisan inspire`, 5 corridas):
;
;   enable_cli sin file_cache ....... 0,33-0,38 s   <- PEOR que no tener nada
;   OPcache CLI apagado (control) ... 0,18-0,19 s
;   enable_cli + file_cache ......... 0,14-0,15 s   (0,77 s la primera, que escribe el cache)
;
; Importa porque el scheduler arranca un `schedule:run` por minuto MAS el `queue:work` bajo
; demanda de la cola `background`: son ~2.880 arranques por dia.
opcache.enable_cli = 1
opcache.file_cache = /tmp/opcache

; El codigo es inmutable dentro de la imagen y /tmp vive en la capa escribible del contenedor,
; que se recrea en cada deploy: no hay forma de servir opcodes viejos.
opcache.file_cache_consistency_checks = 0

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16

; Laravel + Inertia + el AI SDK pasan holgadamente los 10k archivos del default.
opcache.max_accelerated_files = 20000

; El código vive DENTRO de la imagen y el contenedor se recrea en cada deploy (`git pull`
; no actualiza el contenedor), así que nunca se edita un archivo en caliente: no hace falta
; que OPcache chequee timestamps en cada request.
opcache.validate_timestamps = 0
