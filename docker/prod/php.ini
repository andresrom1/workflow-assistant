[PHP]
; Límites de subida para manuales de aseguradoras (PDFs > 20MB).
; La imagen prod (Dockerfile) copia este archivo; sin él, PHP usa el default (~2M)
; y la ingesta de documentos de coberturas falla. Ver CLAUDE.md (RAG / despliegue).
post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 512M
variables_order = EGPCS

[opcache]
; La imagen php:8.4-fpm-alpine trae OPcache compilado pero APAGADO. Sin esto, cada request
; web recompila todo Laravel desde cero — es el mayor desperdicio de CPU del despliegue, y
; es lo que permite sostener la app con menos vCPU.
opcache.enable = 1

; También en CLI: el scheduler arranca un `schedule:run` por minuto (más el `queue:work`
; bajo demanda de la cola `background`), y sin esto cada arranque recompila el framework.
opcache.enable_cli = 1

opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16

; Laravel + Inertia + el AI SDK pasan holgadamente los 10k archivos del default.
opcache.max_accelerated_files = 20000

; El código vive DENTRO de la imagen y el contenedor se recrea en cada deploy (`git pull`
; no actualiza el contenedor), así que nunca se edita un archivo en caliente: no hace falta
; que OPcache chequee timestamps en cada request.
opcache.validate_timestamps = 0
